# Production stack on the VPS, started by scripts/deploy-vps.sh. Images are built on the dev
# machine and streamed over SSH, so they carry plain local names and a git-commit tag.
# The project name stays "fainens" so the existing Redis container is reused.
name: fainens

services:
  frontend:
    image: fainens-frontend:${FAINENS_TAG:-current}
    restart: unless-stopped
    # Only the host's nginx (fins.rayhan.id) reaches it.
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - backend

  backend:
    image: fainens-backend:${FAINENS_TAG:-current}
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
      - ./attachments:/app/data/attachments
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JOB_RUNNER_MODE=queue
    env_file:
      - .env
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: fainens-backend:${FAINENS_TAG:-current}
    command: ["node", "dist/jobs/worker.js"]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./attachments:/app/data/attachments
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JOB_RUNNER_MODE=queue
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port: only the containers above use it.
    expose:
      - "6379"
