version: "3.9"

services:
  frontend:
    image: ${FAINENS_IMAGE_REGISTRY:-docker.io}/${FAINENS_IMAGE_NAMESPACE:-fainens}/fainens-frontend:${FAINENS_IMAGE_TAG:-latest}
    ports:
      - "${FAINENS_FRONTEND_PORT:-8082}:80"
    depends_on:
      - backend

  backend:
    image: ${FAINENS_IMAGE_REGISTRY:-docker.io}/${FAINENS_IMAGE_NAMESPACE:-fainens}/fainens-backend:${FAINENS_IMAGE_TAG:-latest}
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
      - ./attachments:/app/data/attachments
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JOB_RUNNER_MODE=queue
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    env_file:
      - .env

  worker:
    image: ${FAINENS_IMAGE_REGISTRY:-docker.io}/${FAINENS_IMAGE_NAMESPACE:-fainens}/fainens-backend:${FAINENS_IMAGE_TAG:-latest}
    command: ["node", "dist/jobs/worker.js"]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./attachments:/app/data/attachments
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JOB_RUNNER_MODE=queue
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const Redis=require('ioredis'); const r=new Redis(process.env.REDIS_URL,{maxRetriesPerRequest:1,enableOfflineQueue:false}); r.scan('0','MATCH','fainens:worker:heartbeat:*','COUNT',100).then(([c,k])=>{r.quit(); process.exit(k.length>0?0:1)}).catch(()=>{r.disconnect(); process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
